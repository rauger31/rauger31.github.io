<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Invitation pour Mélanie </title>

<style>
body{
    margin:0;
    background:#e8d7c3;
    font-family: 'Georgia', serif;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.card{
    width:350px;
    background:#f2e4d4;
    padding:20px;
    border-radius:25px;
    text-align:center;
    box-shadow:0 5px 15px rgba(0,0,0,0.2);
}

.photo{
    width:100%;
    border-radius:15px;
}

h1{
    font-size:38px;
    margin:20px 0 5px;
    color:#5c4333;
}

p{
    font-size:22px;
    color:#6d5240;
}

button{
    margin-top:20px;
    background:#7c9b6d;
    color:white;
    border:none;
    padding:15px 35px;
    border-radius:15px;
    font-size:18px;
    cursor:pointer;
}
</style>
</head>

<body>

<div class="card">

    <img src="images/Image7.jpg" class="photo">

    <div id="result"></div>
    
    <button onclick="window.location.href='https://www.instagram.com/_rauger_/'">
      (dis moi tes choix sur insta pcq j'ai pas réussis à récupérer mdrrr)
    </button>

</div>

<script>
window.onload = function() {

    const date = localStorage.getItem("date");
    const activite = localStorage.getItem("activite");

    const container = document.querySelector(".card");
    container.style.opacity = 0;
    container.style.transform = "translateY(20px)";

    setTimeout(() => {

        container.style.transition = "1s";
        container.style.opacity = 1;
        container.style.transform = "translateY(0px)";

        container.innerHTML = `
            <h2>❤️ Notre rendez-vous est confirmé</h2>

            <p style="font-size:18px;">
                📅 <strong>Date :</strong> ${date}
            </p>

            <p style="font-size:18px;">
                🎯 <strong>Activité :</strong> ${activite}
            </p>

            <p style="margin-top:20px; font-size:20px;">
                Déjà hâte !
            </p>

            <button onclick="window.location.href='https://www.instagram.com/_rauger_/'">
              (hésites pas à cliquer ici pour me prévenir quand tu as répondu 🙃)
            </button>

            <div style="font-size:40px; margin-top:20px;">
                ❤️
            </div>
        `;

    }, 500);
};
</script>
    
</body>
</html>
