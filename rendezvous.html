<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Invitation pour Mélanie </title>

<style>
body{
    margin:0;
    background:#e8d7c3;
    font-family: 'Georgia', serif;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.card{
    width:350px;
    background:#f2e4d4;
    padding:20px;
    border-radius:25px;
    text-align:center;
    box-shadow:0 5px 15px rgba(0,0,0,0.2);
}

.photo{
    width:100%;
    border-radius:15px;
}

h1{
    font-size:38px;
    margin:20px 0 5px;
    color:#5c4333;
}

p{
    font-size:22px;
    color:#6d5240;
}

button{
    margin-top:20px;
    background:#7c9b6d;
    color:white;
    border:none;
    padding:15px 35px;
    border-radius:15px;
    font-size:18px;
    cursor:pointer;
}
</style>
</head>

<body>

<div class="card">
    <img src="images/Image7.jpg" class="photo">
    
    <button onclick="window.location.href='https://www.instagram.com/_rauger_/'">
      (dis moi tes choix sur insta pcq j'ai pas réussis à récupérer mdrrr)
    </button>
</div>

<script>
window.onload = function() {

    const date = localStorage.getItem("date");
    const activite = localStorage.getItem("activite");

    const container = document.querySelector(".container");

    container.innerHTML = `
        <h2>On a un rendez-vous ❤️</h2>

        <p><strong>Date :</strong> ${date}</p>
        <p><strong>Activité :</strong> ${activite}</p>

        <p style="margin-top:20px;">
            J’ai déjà hâte ✨
        </p>
    `;
};
</script>
    
</body>
</html>
