<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Invitation pour Mélanie</title>

<style>
body{
    margin:0;
    background:#e8d7c3;
    font-family: 'Georgia', serif;
}

/* CONTAINER UNIQUE */
.container{
    height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    position:relative;
    text-align:center;
}

/* IMAGE PRINCIPALE */
.photo{
    width:350px;
    border-radius:15px;
    box-shadow:0 5px 15px rgba(0,0,0,0.2);
}

/* TEXTE */
h1, h2{
    color:#5c4333;
}

p{
    font-size:18px;
    color:#6d5240;
}

/* BOUTON */
button{
    margin-top:20px;
    background:#7c9b6d;
    color:white;
    border:none;
    padding:15px 35px;
    border-radius:15px;
    font-size:18px;
    cursor:pointer;
}

/* IMAGE BAS */
.bottom-img{
    position:absolute;
    bottom:10px;
    right:10px;
    width:40px;
    height:40px;
    object-fit:cover;
}
</style>
</head>

<body>

<div class="container">

    <img src="images/Image7.jpg" class="photo">

    <div id="result"></div>

    <button onclick="window.location.href='https://www.instagram.com/_rauger_/'">
        (dis moi tes choix sur insta pcq j'ai pas réussis à récupérer mdrrr)
    </button>

    <!-- image en bas du container -->
    <img src="images/Image13" class="bottom-img">

</div>

<script>
window.onload = function() {

    const date = localStorage.getItem("date");
    const activite = localStorage.getItem("activite");

    const container = document.querySelector(".container");

    container.style.opacity = 0;
    container.style.transform = "translateY(20px)";

    setTimeout(() => {

        container.style.transition = "1s";
        container.style.opacity = 1;
        container.style.transform = "translateY(0px)";

        container.innerHTML = `
            <h2>❤️ Notre rendez-vous est confirmé</h2>

            <p>📅 <strong>Date :</strong> ${date}</p>

            <p>🎯 <strong>Activité :</strong> ${activite}</p>

            <p style="margin-top:20px;">
                Déjà hâte !
            </p>

            <button onclick="window.location.href='https://www.instagram.com/_rauger_/'">
                Refermer la lettre
            </button>

            <div style="font-size:40px; margin-top:20px;">
                ❤️
            </div>
        `;

    }, 500);
};
</script>

</body>
</html>
