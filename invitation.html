<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
    background:#e7d7c4;
    font-family:Georgia, serif;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.container{
    width:360px;
    background:#f4e5d5;
    border-radius:25px;
    padding:20px;
    text-align:center;
}

.top-img{
    width:100%;
    border-radius:20px;
}

.question{
    font-size:30px;
    margin:20px 0;
    color:#5f4735;
}

.options{
    display:flex;
    gap:15px;
}

.choice{
    flex:1;
}

.choice img{
    width:100%;
    border-radius:15px;
}

.btn-yes{
    background:#6d965e;
}

.btn-no{
    background:#8b5d5d;
}

button{
    width:100%;
    padding:12px;
    border:none;
    color:white;
    border-radius:12px;
    margin-top:10px;
    font-size:18px;
}
</style>
</head>

<body>

<div class="container">

    <img src="remi2.jpg" class="top-img">

    <div class="question">
        Accepteriez-vous un second rdv avec Rémi ? (dites oui svp)
    </div>

    <div class="options">

        <div class="choice">
            <img src="Image (6).jpg">
            <button class="btn-yes"
            onclick="window.location.href='merci.html'">
                OUI
            </button>
        </div>

        <div class="choice">
            <img src="Image (10).jpg">
            <button class="no-btn" id="noButton">Non 😢</button>
            <script src="script.js"></script>

        </div>

    </div>

</div>

</body>
</html>
