<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">

<style>
body{
    margin:0;
    background:#e8d6c3;
    font-family:Georgia, serif;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.container{
    width:370px;
    background:#f5e6d6;
    padding:20px;
    border-radius:25px;
}

h2{
    text-align:center;
    color:#5d4635;
}

.calendar{
    background:white;
    padding:15px;
    border-radius:15px;
    margin-bottom:20px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
}

.activity{
    background:white;
    border-radius:12px;
    overflow:hidden;
    text-align:center;
    font-size:14px;
}

.activity img{
    width:100%;
    height:90px;
    object-fit:cover;
}

button{
    margin-top:20px;
    width:100%;
    padding:15px;
    border:none;
    background:#7b9a6b;
    color:white;
    border-radius:15px;
    font-size:18px;
}
</style>
</head>

<body>

<div class="container">

    <h2>Choisis une date ❤️</h2>

    <div class="calendar">
        📅 Mai 2026
    </div>

    <h2>Quel style de rendez-vous ?</h2>

    <div class="grid">

        <div class="activity">
            <img src="wine.jpg">
            Verre
        </div>

        <div class="activity">
            <img src="restaurant.jpg">
            Resto
        </div>

        <div class="activity">
            <img src="cinema.jpg">
            Cinéma
        </div>

        <div class="activity">
            <img src="images/Image (8).jpg">
            Rando pyrénée
        </div>

        <div class="activity">
            <img src="images/Image (3).jpg">
            Pétanque & coucher de soleil à Pech David
        </div>

        <div class="activity">
            <img src="images/Image (7).jpg">
            Course à pied (si tu veux me voir à genoux)
        </div>

    </div>

    <button onclick="window.location.href='rendezvous.html'">
            C'EST PARFAIT !!
    </button>

</div>

</body>
</html>
