<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>Choix du rendez-vous</title>

<style>

body{
    margin:0;
    background:#e8d6c3;
    font-family:Georgia, serif;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding:20px;
}

.container{
    width:370px;
    background:#f5e6d6;
    padding:20px;
    border-radius:25px;
    box-shadow:0 5px 15px rgba(0,0,0,0.15);
}

h2{
    text-align:center;
    color:#5d4635;
    margin-bottom:15px;
}

.date-box{
    background:white;
    padding:15px;
    border-radius:15px;
    margin-bottom:25px;
}

input[type="date"]{
    width:100%;
    padding:12px;
    border-radius:10px;
    border:2px solid #d8c0a8;
    font-size:16px;
    box-sizing:border-box;
}

.grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:12px;
}

.activity{
    position:relative;
}

.activity input{
    display:none;
}

.activity label{
    display:block;
    background:white;
    border-radius:15px;
    overflow:hidden;
    cursor:pointer;
    transition:0.3s;
    border:3px solid transparent;
    height:100%;
}

.activity label:hover{
    transform:scale(1.03);
}

.activity img{
    width:100%;
    height:110px;
    object-fit:cover;
}

.activity span{
    display:block;
    padding:10px;
    text-align:center;
    font-size:14px;
    color:#5d4635;
}

.activity input:checked + label{
    border:3px solid #7b9a6b;
    background:#eef5ea;
}

button{
    margin-top:25px;
    width:100%;
    padding:16px;
    border:none;
    background:#7b9a6b;
    color:white;
    border-radius:15px;
    font-size:18px;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    background:#6a895c;
}

.result{
    margin-top:20px;
    background:white;
    padding:15px;
    border-radius:15px;
    color:#5d4635;
    display:none;
}

</style>
</head>

<body>

<div class="container">

    <h2>Choisis une date ❤️</h2>

    <div class="date-box">
        <input type="date" id="date">
    </div>

    <h2>Quel style de rendez-vous ?</h2>

    <div class="grid">

        <div class="activity">
            <input type="radio" name="activity" id="verre" value="Aller boire un verre 🍷">
            <label for="verre">
                <img src="images/Image6.jpg">
                <span>Verre</span>
            </label>
        </div>

        <div class="activity">
            <input type="radio" name="activity" id="resto" value="Restaurant 🍝">
            <label for="resto">
                <img src="images/Image11.jpg">
                <span>Resto</span>
            </label>
        </div>

        <div class="activity">
            <input type="radio" name="activity" id="cinema" value="Cinéma 🍿">
            <label for="cinema">
                <img src="images/Image4.jpg">
                <span>Cinéma</span>
            </label>
        </div>

        <div class="activity">
            <input type="radio" name="activity" id="rando" value="Randonnée Pyrénées ⛰️">
            <label for="rando">
                <img src="images/Image8.jpg">
                <span>Rando Pyrénées</span>
            </label>
        </div>

        <div class="activity">
            <input type="radio" name="activity" id="petanque" value="Pétanque & coucher de soleil 🌅">
            <label for="petanque">
                <img src="images/Image3.jpg">
                <span>Pétanque & sunset</span>
            </label>
        </div>

        <div class="activity">
            <input type="radio" name="activity" id="course" value="Course à pied 🏃">
            <label for="course">
                <img src="images/Image7.jpg">
                <span>Course à pied (si tu veux m'humilier)</span>
            </label>
        </div>

    </div>

    <button onclick="validerChoix()">
        C'EST PARFAIT !!
    </button>

    <div class="result" id="result"></div>

</div>

<script>

function validerChoix(){

    const date = document.getElementById("date").value;
    const activite = document.querySelector('input[name="activity"]:checked');

    if(!date){
        alert("Choisis une date ❤️");
        return;
    }

    if(!activite){
        alert("Choisis une activité ❤️");
        return;
    }

    // 🎉 CONFETTIS
    confetti({
        particleCount: 150,
        spread: 90,
        origin: { y: 0.6 }
    });

    const result = document.getElementById("result");

    result.style.display = "block";
    result.innerHTML = `
        <h3>Rendez-vous confirmé ❤️</h3>
        <p><strong>Date :</strong> ${date}</p>
        <p><strong>Activité :</strong> ${activite.value}</p>
    `;

    localStorage.setItem("date", date);
    localStorage.setItem("activite", activite.value);
    
    setTimeout(() => {
        window.location.href = "rendezvous.html";
    }, 2000);
}

</script>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</body>
</html>
